# 一键拉起考试平台的全部中间件依赖
# 使用：docker compose up -d
# 容器名使用 oep- 前缀，避免与本机其他项目的同名容器冲突
services:
  mysql:
    image: mysql:8.0
    container_name: oep-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: campus_exam
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 若宿主机 3306 被占用，可改为 "3307:3306"，后端用 DB_PORT=3307 覆盖
    ports:
      - "3307:3306"
    volumes:
      - exam-mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: oep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - exam-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: oep-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: exam
      RABBITMQ_DEFAULT_PASS: exam123456
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - exam-rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  exam-mysql-data:
  exam-redis-data:
  exam-rabbit-data:
