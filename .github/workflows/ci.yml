name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build & Test
        run: mvn -B -ntp clean verify

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-mini/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
